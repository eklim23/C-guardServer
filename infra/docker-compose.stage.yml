services:
  cguard-server:
    image: node:20-alpine
    container_name: cguard-stage-server
    working_dir: /app
    command: ["node", "server/start.js"]
    environment:
      TZ: Asia/Seoul
      PORT: "8500"
      STATE_MODE: memory
      CGUARD_ADMIN_USERNAME: ${CGUARD_ADMIN_USERNAME:-admin}
      CGUARD_ADMIN_PASSWORD: ${CGUARD_ADMIN_PASSWORD:?set CGUARD_ADMIN_PASSWORD}
      CGUARD_ADMIN_ROLE: ${CGUARD_ADMIN_ROLE:-enforcer}
      ADMIN_SIGNING_SECRET: ${CGUARD_ADMIN_SIGNING_SECRET:?set CGUARD_ADMIN_SIGNING_SECRET}
      ADMIN_TOKEN_TTL_SEC: ${CGUARD_ADMIN_TOKEN_TTL_SEC:-14400}
      CGUARD_ARCHIVE_DIR: /data/cguard-archive
      CGUARD_ARCHIVE_SESSION_GROUP_SIZE: "7"
      CGUARD_ARCHIVE_MEMORY_EVENT_LIMIT: ${CGUARD_ARCHIVE_MEMORY_EVENT_LIMIT:-50000}
      INTEGRATION_PUBLIC_BASE_URL: ${CGUARD_PUBLIC_BASE_URL:-http://cifrar.cju.ac.kr:8500}
      INTEGRATION_API_ENABLED: ${INTEGRATION_API_ENABLED:-true}
      CGUARD_INTEGRATION_TOKEN: ${CGUARD_INTEGRATION_TOKEN:?set CGUARD_INTEGRATION_TOKEN}
      INTEGRATION_DISCORD_IDENTITY_AUTH_URL_TEMPLATE: ${INTEGRATION_DISCORD_IDENTITY_AUTH_URL_TEMPLATE:-http://cifrar.cju.ac.kr:8600/discord/start?user_id={user_id}&session_id={session_id}&reason_code={reason_code}&server_base_url={server_base_url}}
      INTEGRATION_DISCORD_REQUIRE_LINKED: ${INTEGRATION_DISCORD_REQUIRE_LINKED:-false}
      INTEGRATION_DISCORD_REQUIRE_LINKED_ACTION: ${INTEGRATION_DISCORD_REQUIRE_LINKED_ACTION:-restricted}
      INTEGRATION_DISCORD_REQUIRE_LINKED_GRACE_SEC: ${INTEGRATION_DISCORD_REQUIRE_LINKED_GRACE_SEC:-0}
      INTEGRATION_DISCORD_IDENTITY_ALLOW_RELINK: ${INTEGRATION_DISCORD_IDENTITY_ALLOW_RELINK:-true}
      ANTILLM_PARTICIPANT_AUTO_BAN_CLIENT_AGENT_STOPPED: "false"
      CGUARD_CLI_DETECTION_ACTION: monitor
    volumes:
      - ../services/cguard:/app:ro
      - cguard_stage_archive:/data/cguard-archive
    ports:
      - "${CGUARD_SERVER_PORT:-8500}:8500"
    restart: unless-stopped

  cguard-frontend:
    image: node:24-alpine
    container_name: cguard-stage-frontend
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CGUARD_API_URL: http://cguard-server:8500
      NEXT_PUBLIC_API_URL: http://cguard-server:8500
    volumes:
      - ../frontend/.next/standalone:/app:ro
    ports:
      - "${CGUARD_FRONTEND_PORT:-8080}:3000"
    depends_on:
      - cguard-server
    restart: unless-stopped

  cguard-oauth-bridge:
    image: node:20-alpine
    container_name: cguard-stage-oauth-bridge
    working_dir: /app
    command: ["node", "src/server.js"]
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      PORT: "8600"
      PUBLIC_BASE_URL: ${CGUARD_OAUTH_PUBLIC_BASE_URL:-http://cifrar.cju.ac.kr:8600}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://cifrar.cju.ac.kr:8600/discord/callback}
      CGUARD_SERVER_BASE_URL: http://cguard-server:8500
      CGUARD_INTEGRATION_TOKEN: ${CGUARD_INTEGRATION_TOKEN:?set CGUARD_INTEGRATION_TOKEN}
      OAUTH_STATE_SIGNING_SECRET: ${OAUTH_STATE_SIGNING_SECRET:?set OAUTH_STATE_SIGNING_SECRET}
      OAUTH_STATE_TTL_SEC: ${OAUTH_STATE_TTL_SEC:-600}
      CGUARD_ALLOW_SELF_SIGNED_TLS: "false"
    volumes:
      - ../services/cguard-oauth-bridge:/app:ro
    ports:
      - "${CGUARD_OAUTH_PORT:-8600}:8600"
    depends_on:
      - cguard-server
    restart: unless-stopped

volumes:
  cguard_stage_archive:
