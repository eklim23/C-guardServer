server {
    listen 80;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $cguard_frontend_upstream http://cguard-frontend:3000;
    set $cguard_api_upstream http://cguard-server:8500;

    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate     /etc/nginx/ssl/cguard-admin.crt;
    ssl_certificate_key /etc/nginx/ssl/cguard-admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_cguard:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location = / {
        return 302 /cguard-admin;
    }

    location /cguard-api/ {
        rewrite ^/cguard-api/(.*)$ /$1 break;
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/auth/login {
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /v1/client/ {
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location = /v1/events {
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location = /v1/verify {
        proxy_pass $cguard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /v1/ {
        return 404;
    }

    location /_next/ {
        proxy_pass $cguard_frontend_upstream;
        proxy_set_header Host $host;
        expires 1d;
    }

    location = /favicon.ico {
        proxy_pass $cguard_frontend_upstream;
        proxy_set_header Host $host;
    }

    location /cguard-admin {
        proxy_pass $cguard_frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ops_zone burst=50 nodelay;
    }

    location / {
        return 404;
    }
}
