worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 보안 헤더 (전역)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate Limit 영역 (conf.d에서 참조)
    limit_req_zone $binary_remote_addr zone=scoreboard_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ops_zone:10m rate=60r/s;

    # 프록시 캐시 (스코어보드 API 응답 캐싱)
    proxy_cache_path /var/cache/nginx/scoreboard levels=1:2 keys_zone=scoreboard_cache:10m max_size=100m inactive=1m;

    # ── HTTP 80 — HTTPS 리다이렉트 전용 (기획서 06-network-ssl.md) ──
    server {
        listen 80;
        server_name _;

        # 헬스체크 (Docker/로드밸런서용)
        location /nginx-health {
            access_log off;
            return 200 "ok";
        }

        # 나머지 전부 → HTTPS 443(스코어보드)으로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── SSL 서버 블록 (conf.d에서 로드) ──
    # scoreboard.conf — :443 스코어보드 (공개)
    # ops-portal.conf — :8443 운영 포털 (비공개, 참가자 차단)
    include /etc/nginx/conf.d/*.conf;
}
